<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000;
    -webkit-user-select:none; user-select:none; touch-action:none; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #err { position:fixed; inset:0; display:none; place-items:center; color:#777;

  /* same pill nav as the orb app, dark variant for the black void */
  #tabs {
    position: fixed; top: calc(18px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 2px;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px; padding: 3px;

  #tabs a {
    font: 600 10px/1 -apple-system, system-ui, sans-serif;

  #tabs a.on { color: rgba(0,0,0,0.88); background: rgba(255,255,255,0.92); }
  #cap {
    position: fixed; left: 18px; bottom: calc(16px + env(safe-area-inset-bottom));
    color: rgba(255,255,255,0.28);

    letter-spacing: 0.22em; text-transform: uppercase; pointer-events: none;
  }
  body.bare #tabs, body.bare #cap { display: none; }
</style>
<script>
/* SELF-UPDATE. A single-file app on a static host has one failure mode that
   actually bites people: the browser keeps the old HTML and there is no way to
   set cache headers on GitHub Pages, so a shipped fix can sit there unseen.
   Each page carries the build it was cut from and checks a tiny manifest
   against it; if the server has moved on, it reloads ONCE through a URL the
   cache cannot answer. The sessionStorage guard is keyed on the STALE id, so a
   reload that somehow still serves stale stops instead of looping. The ?b= is
   deliberately left in the address bar - stripping it would send the next
   plain reload straight back to the cached copy. */
(function(){
  var BUILD = '1687ec2439';
  // empty = a standalone bundle with no site to check against; '{' = an
  // unbuilt source file opened directly. Neither should ever reload.
  if (!BUILD || BUILD.charAt(0) === '{') return;
  try { if (sessionStorage.getItem('orb-build') === BUILD) return; } catch (e) {}
  fetch('/version.json', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(v){
      if (!v || !v.b || v.b === BUILD) return;
      try { sessionStorage.setItem('orb-build', BUILD); } catch (e) {}
      var u = new URL(location.href);
      u.searchParams.set('b', v.b);
      location.replace(u.toString());
    })
    .catch(function(){});
})();
</script>

<nav id="tabs">
  <a href="/glass">Glass</a><a href="/eye">Eye</a><a href="/foam">Foam</a><a href="/mask">Mask</a><a href="/fly">Fly</a><a class="on" href="/office">Office</a>
</nav>

<div id="err">WEBGL2 REQUIRED</div>
<script>
'use strict';
/* ============================================================
   OFFICE — a Gaussian-splat render of a corner office.

   A real 3DGS pipeline, no libraries: every splat is an
   anisotropic 3D gaussian (position + covariance + colour);
   the vertex shader projects the covariance through the view
   Jacobian to a screen-space conic, splats are depth-sorted on
   the CPU each frame (16-bit counting sort) and painter-blended
   back-to-front. The "scan" itself is generated procedurally:
   surfaces are scattered with surfel discs, lighting (window
   sun shaft, ambient, contact occlusion) is baked into the
   splat colours, and the classic reconstruction artifacts —
   warped surfaces, edge fuzz, floaters, dust in the light
   beam — are synthesized on purpose. Nothing is fetched.
   ============================================================ */

if (new URLSearchParams(location.search).get('bare') === '1') document.body.classList.add('bare');

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false });
if (!gl) { document.getElementById('err').style.display = 'grid'; throw new Error('webgl2'); }

/* ---------------- tiny math ---------------- */
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
let seed = 1234567;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = (h ^ (h >> 13)) * 1274126177 | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
/* value noise, one octave — used for scan-warp and colour mottle */
function vnoise(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
  const fx = x - ix, fy = y - iy, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const n = (a, b, c) => hash3(ix + a, iy + b, iz + c);
  return (n(0,0,0) * (1-u) + n(1,0,0) * u) * (1-v) * (1-w)
       + (n(0,1,0) * (1-u) + n(1,1,0) * u) * v * (1-w)
       + (n(0,0,1) * (1-u) + n(1,0,1) * u) * (1-v) * w
       + (n(0,1,1) * (1-u) + n(1,1,1) * u) * v * w;
}

/* ---------------- splat store ----------------
   Scene units are decimetres (metres x 10) so the covariance
   entries stay clear of half-float denormals when packed. */
const MU = 10;                     // metres -> scene units
const MAXN = 170000;
const pos  = new Float32Array(MAXN * 3);
const cov  = new Float32Array(MAXN * 6);   // xx xy xz yy yz zz
const col  = new Uint8Array(MAXN * 4);
let N = 0;

/* the reconstruction never gets surfaces perfectly flat — every
   splat rides a low-frequency warp field plus fine jitter */
function warp(p) {
  const s = 0.9;
  return [
    p[0] + 0.010 * (vnoise(p[0]*s, p[1]*s, p[2]*s) - 0.5) * 2,
    p[1] + 0.008 * (vnoise(p[0]*s + 7.1, p[1]*s, p[2]*s) - 0.5) * 2,
    p[2] + 0.010 * (vnoise(p[0]*s, p[1]*s + 3.3, p[2]*s) - 0.5) * 2,
  ];
}

function addSplat(p, t1, t2, n, s1, s2, sn, r, g, b, a) {
  if (N >= MAXN) return;
  const q = warp(p);
  const i3 = N * 3, i6 = N * 6, i4 = N * 4;
  pos[i3] = q[0] * MU; pos[i3+1] = q[1] * MU; pos[i3+2] = q[2] * MU;
  const A = s1 * s1 * MU * MU, B = s2 * s2 * MU * MU, C = sn * sn * MU * MU;
  cov[i6]   = A*t1[0]*t1[0] + B*t2[0]*t2[0] + C*n[0]*n[0];
  cov[i6+1] = A*t1[0]*t1[1] + B*t2[0]*t2[1] + C*n[0]*n[1];
  cov[i6+2] = A*t1[0]*t1[2] + B*t2[0]*t2[2] + C*n[0]*n[2];
  cov[i6+3] = A*t1[1]*t1[1] + B*t2[1]*t2[1] + C*n[1]*n[1];
  cov[i6+4] = A*t1[1]*t1[2] + B*t2[1]*t2[2] + C*n[1]*n[2];
  cov[i6+5] = A*t1[2]*t1[2] + B*t2[2]*t2[2] + C*n[2]*n[2];
  col[i4]   = clamp01(r) * 255;
  col[i4+1] = clamp01(g) * 255;
  col[i4+2] = clamp01(b) * 255;
  col[i4+3] = clamp01(a) * 255;
  N++;
}

/* ---------------- baked lighting ----------------
   One warm sun through the window (true window-shaped mask, so
   the light pool + mullion shadows land on the floor and desk
   for free), a cool ambient dome, and analytic contact AO. */
const X0 = -2.0, Z0 = -1.5, ROOM_H = 2.7;                 // corner walls
const WX0 = -0.3, WX1 = 1.1, WY0 = 0.95, WY1 = 2.35;      // window on back wall
const WMX = (WX0 + WX1) / 2, WMY = (WY0 + WY1) / 2;       // mullion cross
const L = (() => { const v = [-0.32, -0.62, 0.72]; const l = Math.hypot(...v); return v.map(x => x / l); })();
const DESK = { x: 0.15, z: -0.90, hx: 0.75, hz: 0.35, top: 0.74 };

function windowMask(wx, wy) {
  const e = 0.05;
  let m = ss(WX0, WX0 + e, wx) * (1 - ss(WX1 - e, WX1, wx))
        * ss(WY0, WY0 + e, wy) * (1 - ss(WY1 - e, WY1, wy));
  m *= ss(0.030, 0.075, Math.abs(wx - WMX));
  m *= ss(0.030, 0.075, Math.abs(wy - WMY));
  return m;
}

function sunAt(p, n) {
  const lam = -(n[0]*L[0] + n[1]*L[1] + n[2]*L[2]);
  if (lam <= 0) return 0;
  const t = (p[2] - Z0) / L[2];
  if (t <= 0) return 0;
  let s = windowMask(p[0] - t*L[0], p[1] - t*L[1]) * lam;
  if (s > 0) {
    // desk slab occludes the beam (soft shadow under/behind the desk)
    const td = (p[1] - DESK.top) / L[1];
    if (td > 0.02) {
      const qx = p[0] - td*L[0], qz = p[2] - td*L[2];
      const inx = ss(0.10, 0.0, Math.abs(qx - DESK.x) - DESK.hx);
      const inz = ss(0.10, 0.0, Math.abs(qz - DESK.z) - DESK.hz);
      s *= 1 - 0.85 * inx * inz;
    }
  }
  return s;
}

function aoAt(p, n) {
  let occ = 0;
  if (Math.abs(n[0]) < 0.9) occ += Math.exp(-(p[0] - X0) / 0.30);
  if (Math.abs(n[2]) < 0.9) occ += Math.exp(-(p[2] - Z0) / 0.30);
  if (Math.abs(n[1]) < 0.9) occ += Math.exp(-p[1] / 0.28);
  return 1 - 0.38 * Math.min(occ, 1.35);
}
/* cavity darkening under the desk slab */
function aoUnderDesk(p) {
  if (p[1] >= DESK.top - 0.01) return 1;
  const inx = ss(0.15, -0.05, Math.abs(p[0] - DESK.x) - DESK.hx);
  const inz = ss(0.15, -0.05, Math.abs(p[2] - DESK.z) - DESK.hz);
  return 1 - 0.42 * inx * inz;
}

const AMB = [0.58, 0.61, 0.68];
const SUN = [1.45, 1.24, 0.94];

function shade(p, n, alb, o) {
  o = o || {};
  if (o.em) return alb.slice();
  const sun = sunAt(p, n) * (o.sun !== undefined ? o.sun : 1);
  const dome = 0.50 + 0.16 * (n[1] * 0.5 + 0.5) + 0.06 * Math.max(0, n[2]);
  const ao = aoAt(p, n) * aoUnderDesk(p) * (o.ao !== undefined ? o.ao : 1);
  const m = 0.94 + 0.12 * vnoise(p[0]*3.1, p[1]*3.1, p[2]*3.1);
  return [
    clamp01(alb[0] * (dome * ao * AMB[0] + sun * SUN[0]) * m),
    clamp01(alb[1] * (dome * ao * AMB[1] + sun * SUN[1]) * m),
    clamp01(alb[2] * (dome * ao * AMB[2] + sun * SUN[2]) * m),
  ];
}

/* ---------------- surface scatter helpers ---------------- */
const SIGK = 1.05;
function sigFor(dens) { return SIGK / Math.sqrt(dens); }

/* rect: centre c, half-extent vectors u,v (length = half size), unit normal n.
   mat(p,n,a,b) -> {c:[r,g,b], a?, em?, ao?, sun?, sig?} (a,b in 0..1 across the rect) */
function rect(c, u, v, n, dens, mat) {
  const lu = Math.hypot(...u), lv = Math.hypot(...v);
  const t1 = u.map(x => x / lu), t2 = v.map(x => x / lv);
  const area = 4 * lu * lv;
  const count = Math.max(1, Math.round(area * dens));
  const s0 = sigFor(dens);
  for (let i = 0; i < count; i++) {
    const a = rnd(), b = rnd();
    const p = [
      c[0] + u[0] * (2*a - 1) + v[0] * (2*b - 1),
      c[1] + u[1] * (2*a - 1) + v[1] * (2*b - 1),
      c[2] + u[2] * (2*a - 1) + v[2] * (2*b - 1),
    ];
    const m = mat(p, n, a, b);
    if (!m) continue;
    const cc = m.em ? m.c : shade(p, n, m.c, m);
    const sj = (m.sig || 1) * s0;
    addSplat(p, t1, t2, n,
      sj * (0.7 + 0.9 * rnd()), sj * (0.7 + 0.9 * rnd()), sj * 0.14,
      cc[0], cc[1], cc[2], m.a !== undefined ? m.a : 0.82 + 0.13 * rnd());
  }
}

/* box: centre, half sizes along an (optional) orthonormal frame F=[u,v,w] */
function box(c, hx, hy, hz, dens, mat, o) {
  o = o || {};
  const F = o.frame || [[1,0,0],[0,1,0],[0,0,1]];
  const ax = (f, s) => f.map(x => x * s);
  const add3 = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]];
  const faces = [
    { off: ax(F[0],  hx), u: ax(F[1], hy), v: ax(F[2], hz), n: F[0],              k: '+x' },
    { off: ax(F[0], -hx), u: ax(F[1], hy), v: ax(F[2], hz), n: F[0].map(x=>-x),   k: '-x' },
    { off: ax(F[1],  hy), u: ax(F[0], hx), v: ax(F[2], hz), n: F[1],              k: '+y' },
    { off: ax(F[1], -hy), u: ax(F[0], hx), v: ax(F[2], hz), n: F[1].map(x=>-x),   k: '-y' },
    { off: ax(F[2],  hz), u: ax(F[0], hx), v: ax(F[1], hy), n: F[2],              k: '+z' },
    { off: ax(F[2], -hz), u: ax(F[0], hx), v: ax(F[1], hy), n: F[2].map(x=>-x),   k: '-z' },
  ];
  for (const f of faces) {
    if (o.skip && o.skip.includes(f.k)) continue;
    rect(add3(c, f.off), f.u, f.v, f.n, dens, mat);
  }
}

/* cylinder along unit axis a from base b */
function cyl(b, a, r, h, dens, mat, caps) {
  let up = Math.abs(a[1]) < 0.9 ? [0,1,0] : [1,0,0];
  let b1 = [a[1]*up[2]-a[2]*up[1], a[2]*up[0]-a[0]*up[2], a[0]*up[1]-a[1]*up[0]];
  const l1 = Math.hypot(...b1); b1 = b1.map(x => x / l1);
  const b2 = [a[1]*b1[2]-a[2]*b1[1], a[2]*b1[0]-a[0]*b1[2], a[0]*b1[1]-a[1]*b1[0]];
  const area = 2 * Math.PI * r * h;
  const count = Math.max(1, Math.round(area * dens));
  const s0 = sigFor(dens);
  for (let i = 0; i < count; i++) {
    const th = rnd() * Math.PI * 2, hh = rnd() * h;
    const cs = Math.cos(th), sn2 = Math.sin(th);
    const n = [cs*b1[0]+sn2*b2[0], cs*b1[1]+sn2*b2[1], cs*b1[2]+sn2*b2[2]];
    const p = [b[0]+a[0]*hh+n[0]*r, b[1]+a[1]*hh+n[1]*r, b[2]+a[2]*hh+n[2]*r];
    const t2 = [-sn2*b1[0]+cs*b2[0], -sn2*b1[1]+cs*b2[1], -sn2*b1[2]+cs*b2[2]];
    const m = mat(p, n, th / (Math.PI*2), hh / h);
    if (!m) continue;
    const cc = m.em ? m.c : shade(p, n, m.c, m);
    addSplat(p, a, t2, n, s0*(0.7+0.9*rnd()), s0*(0.7+0.9*rnd()), s0*0.14,
      cc[0], cc[1], cc[2], m.a !== undefined ? m.a : 0.82 + 0.13*rnd());
  }
  if (caps) {
    const top = [b[0]+a[0]*h, b[1]+a[1]*h, b[2]+a[2]*h];
    const cnt = Math.max(1, Math.round(Math.PI*r*r*dens));
    for (let i = 0; i < cnt; i++) {
      const th = rnd()*Math.PI*2, rr = Math.sqrt(rnd())*r;
      const p = [top[0]+Math.cos(th)*rr*b1[0]+Math.sin(th)*rr*b2[0],
                 top[1]+Math.cos(th)*rr*b1[1]+Math.sin(th)*rr*b2[1],
                 top[2]+Math.cos(th)*rr*b1[2]+Math.sin(th)*rr*b2[2]];
      const m = mat(p, a, th/(Math.PI*2), 1);
      if (!m) continue;
      const cc = m.em ? m.c : shade(p, a, m.c, m);
      addSplat(p, b1, b2, a, s0*(0.7+0.9*rnd()), s0*(0.7+0.9*rnd()), s0*0.14,
        cc[0], cc[1], cc[2], m.a !== undefined ? m.a : 0.85);
    }
  }
}

/* ---------------- the office ---------------- */
function buildScene() {
  const mat = (c, o) => Object.assign({ c }, o);

  /* floor: oak planks running along x */
  rect([0, 0, 0], [2, 0, 0], [0, 0, 1.5], [0, 1, 0], 1700, (p) => {
    const plank = Math.floor((p[2] + 1.5) / 0.16) + Math.floor((p[0] + 6) / 1.2) * 17;
    const seam = (p[2] + 1.5) % 0.16 < 0.012 ? 0.62 : 1;
    const tone = 0.88 + 0.24 * hash3(plank, 3, 7);
    const grain = 0.92 + 0.16 * vnoise(p[0] * 40, 0, p[2] * 7);
    const k = seam * tone * grain;
    return mat([0.60 * k, 0.455 * k, 0.315 * k]);
  });

  /* rug under the desk zone */
  rect([0.25, 0.008, -0.35], [1.05, 0, 0], [0, 0, 0.75], [0, 1, 0], 2100, (p) => {
    const bx = Math.abs(p[0] - 0.25), bz = Math.abs(p[2] + 0.35);
    const border = (1.05 - bx < 0.09) || (0.75 - bz < 0.09);
    const c = border ? [0.26, 0.40, 0.40] : [0.145, 0.255, 0.27];
    const weave = 0.9 + 0.2 * vnoise(p[0] * 55, 0, p[2] * 55);
    return { c: [c[0]*weave, c[1]*weave, c[2]*weave], a: 0.66 + 0.2*rnd(), sig: 1.35 };
  });


  /* back wall (window hole punched out) + left wall */
  const paint = (p) => {
    const base = p[1] < 0.09 ? [0.90, 0.90, 0.88] : [0.845, 0.815, 0.765];
    return mat(base, { sig: 1.35 });
  };
  rect([0, ROOM_H/2, Z0], [2, 0, 0], [0, ROOM_H/2, 0], [0, 0, 1], 1650, (p) => {
    if (p[0] > WX0 - 0.06 && p[0] < WX1 + 0.06 && p[1] > WY0 - 0.06 && p[1] < WY1 + 0.06) return null;
    return paint(p);
  });
  rect([X0, ROOM_H/2, 0], [0, 0, 1.5], [0, ROOM_H/2, 0], [1, 0, 0], 1650, paint);

  /* window frame + mullion cross (bright white, mostly emissive-ish sun-kissed) */
  const frameMat = () => mat([0.92, 0.91, 0.88]);
  const fz = Z0 + 0.02, fd = 0.035;
  box([WMX, WY1 + 0.03, fz], (WX1-WX0)/2 + 0.09, 0.035, fd, 5000, frameMat, { skip: ['-z'] });
  box([WMX, WY0 - 0.03, fz], (WX1-WX0)/2 + 0.09, 0.035, fd, 5000, frameMat, { skip: ['-z'] });
  box([WX0 - 0.045, WMY, fz], 0.035, (WY1-WY0)/2 + 0.02, fd, 5000, frameMat, { skip: ['-z'] });
  box([WX1 + 0.045, WMY, fz], 0.035, (WY1-WY0)/2 + 0.02, fd, 5000, frameMat, { skip: ['-z'] });
  box([WMX, WMY, fz], 0.022, (WY1-WY0)/2, 0.022, 5000, frameMat, { skip: ['-z'] });
  box([WMX, WMY, fz], (WX1-WX0)/2, 0.022, 0.022, 5000, frameMat, { skip: ['-z'] });

  /* sky through the glass — blown out towards the sun corner */
  rect([WMX, WMY, Z0 - 0.06], [(WX1-WX0)/2 + 0.02, 0, 0], [0, (WY1-WY0)/2 + 0.02, 0], [0, 0, 1], 2000, (p) => {
    const v = (p[1] - WY0) / (WY1 - WY0);
    let c = [
      0.80 + 0.13 * v, 0.84 + 0.08 * v, 0.90 + 0.05 * v,
    ];
    const d = Math.hypot(p[0] - (WX1 - 0.25), p[1] - (WY1 - 0.25));
    const sunGlow = Math.exp(-d * d * 6.5);
    c = c.map(x => Math.min(1, x * (0.92 + 0.05*vnoise(p[0]*4, p[1]*4, 1)) + sunGlow * 0.9));
    return { c, em: true, a: 0.92, sig: 1.3 };
  });


  /* picture frame on the left wall */
  box([X0 + 0.025, 1.62, -0.72], 0.02, 0.34, 0.26, 6000, () => mat([0.16, 0.13, 0.11]), { skip: ['-x'] });
  rect([X0 + 0.05, 1.62, -0.72], [0, 0, 0.21], [0, 0.29, 0], [1, 0, 0], 6000, (p, n, a, b) => {
    const w1 = vnoise(a * 5, b * 5, 9.2), w2 = vnoise(a * 11 + 4, b * 11, 2.7);
    const c = w1 > 0.55 ? [0.95, 0.55, 0.28] : (w2 > 0.5 ? [0.30, 0.48, 0.66] : [1.0, 0.97, 0.90]);
    return mat(c, { ao: 1.15 });
  });


  /* ---- desk: walnut slab on black legs ---- */
  const deskTopY = DESK.top, deskH = 0.025;

/* ---------------- pack splats into an RGBA32UI texture ----------------
   2 texels per splat: [bits(x) bits(y) bits(z) half(cxx,cxy)]
                       [half(cxz,cyy) half(cyz,czz) rgba8 0]          */
const _f32 = new Float32Array(1), _u32 = new Uint32Array(_f32.buffer);
function toHalf(val) {
  _f32[0] = val; const x = _u32[0];
  let bits = (x >> 16) & 0x8000;
  const m = (x >> 12) & 0x07ff, e = (x >> 23) & 0xff;
  if (e < 103) return bits;
  if (e > 142) { bits |= 0x7c00; return bits; }
  if (e < 113) { const mm = m | 0x0800; bits |= (mm >> (114 - e)) + ((mm >> (113 - e)) & 1); return bits; }
  bits |= ((e - 112) << 10) | (m >> 1);
  bits += m & 1;
  return bits;
}
const packHalf2 = (a, b) => toHalf(a) | (toHalf(b) << 16);

const TEXW = 2048;
const TEXH = Math.ceil(N / 1024);
const texData = new Uint32Array(TEXW * TEXH * 4);
{

    const o = i * 8, i3 = i * 3, i6 = i * 6, i4 = i * 4;
    texData[o]   = pv[i3];
    texData[o+1] = pv[i3+1];
    texData[o+2] = pv[i3+2];
    texData[o+3] = packHalf2(cov[i6],   cov[i6+1]);
    texData[o+4] = packHalf2(cov[i6+2], cov[i6+3]);
    texData[o+5] = packHalf2(cov[i6+4], cov[i6+5]);
    texData[o+6] = col[i4] | (col[i4+1] << 8) | (col[i4+2] << 16) | (col[i4+3] << 24);
    texData[o+7] = 0;

/* ---------------- GL pipeline ---------------- */
const VS = `#version 300 es
precision highp float;
precision highp int;
precision highp usampler2D;
uniform usampler2D uTex;
uniform mat4 uView, uProj;
uniform vec2 uFocal, uViewport;
in uint aIndex;
out vec4 vColor;
out vec2 vPos;
void main(){
  uint i = aIndex;
  ivec2 t0 = ivec2(int((i & 1023u) << 1u), int(i >> 10u));
  uvec4 A = texelFetch(uTex, t0, 0);
  uvec4 B = texelFetch(uTex, t0 + ivec2(1, 0), 0);
  vec3 center = vec3(uintBitsToFloat(A.x), uintBitsToFloat(A.y), uintBitsToFloat(A.z));
  vec4 cam = uView * vec4(center, 1.0);
  vec4 clip = uProj * cam;
  if (clip.w <= 0.0) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
  vec3 ndc = clip.xyz / clip.w;
  if (abs(ndc.x) > 1.3 || abs(ndc.y) > 1.3 || ndc.z < -1.0 || ndc.z > 1.0) {
    gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return;
  }
  vec2 c01 = unpackHalf2x16(A.w);
  vec2 c23 = unpackHalf2x16(B.x);
  vec2 c45 = unpackHalf2x16(B.y);
  mat3 Vrk = mat3(c01.x, c01.y, c23.x,
                  c01.y, c23.y, c45.x,
                  c23.x, c45.x, c45.y);
  mat3 J = mat3(
    uFocal.x / cam.z, 0.0, -(uFocal.x * cam.x) / (cam.z * cam.z),
    0.0, uFocal.y / cam.z, -(uFocal.y * cam.y) / (cam.z * cam.z),
    0.0, 0.0, 0.0);
  mat3 T = transpose(mat3(uView)) * J;
  mat3 cov2d = transpose(T) * Vrk * T;
  cov2d[0][0] += 0.3;
  cov2d[1][1] += 0.3;
  float mid = (cov2d[0][0] + cov2d[1][1]) * 0.5;
  float rad = length(vec2((cov2d[0][0] - cov2d[1][1]) * 0.5, cov2d[0][1]));
  float l1 = mid + rad, l2 = mid - rad;
  if (l2 < 0.0) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }
  vec2 dv = normalize(vec2(cov2d[0][1], l1 - cov2d[0][0]));
  vec2 majorAxis = min(2.0 * sqrt(2.0 * l1), 2048.0) * dv;
  vec2 minorAxis = min(2.0 * sqrt(2.0 * l2), 2048.0) * vec2(dv.y, -dv.x);
  vColor = vec4(float(B.z & 0xffu), float((B.z >> 8u) & 0xffu),
                float((B.z >> 16u) & 0xffu), float(B.z >> 24u)) / 255.0;
  vec2 corner = vec2(float((gl_VertexID & 1) << 1) - 1.0, float(gl_VertexID & 2) - 1.0) * 2.0;
  vPos = corner;
  gl_Position = vec4(ndc.xy
    + corner.x * majorAxis / uViewport
    + corner.y * minorAxis / uViewport, 0.0, 1.0);
}`;

/* ---------------- depth sort: 16-bit counting sort, every frame ---------------- */
const depths = new Float32Array(N);
const keys = new Uint32Array(N);
const order = new Uint32Array(N);
const counts = new Uint32Array(65536);
function sortSplats(view) {
  const m2 = view[2], m6 = view[6], m10 = view[10];
  let mn = Infinity, mx = -Infinity;
  for (let i = 0, i3 = 0; i < N; i++, i3 += 3) {
    const d = m2 * pos[i3] + m6 * pos[i3+1] + m10 * pos[i3+2];
    depths[i] = d;
    if (d < mn) mn = d; if (d > mx) mx = d;
  }
  const sc = 65535 / Math.max(1e-6, mx - mn);
  counts.fill(0);
  for (let i = 0; i < N; i++) { const k = ((depths[i] - mn) * sc) | 0; keys[i] = k; counts[k]++; }
  let acc = 0;
  for (let k = 0; k < 65536; k++) { const c = counts[k]; counts[k] = acc; acc += c; }
  for (let i = 0; i < N; i++) order[counts[keys[i]]++] = i;   // ascending camZ = far first
  gl.bindBuffer(gl.ARRAY_BUFFER, idxBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, order);
}

  let l = Math.hypot(zx, zy, zz); zx/=l; zy/=l; zz/=l;
  let xx = up[1]*zz - up[2]*zy, xy = up[2]*zx - up[0]*zz, xz = up[0]*zy - up[1]*zx;
  l = Math.hypot(xx, xy, xz) || 1; xx/=l; xy/=l; xz/=l;
  const yx = zy*xz - zz*xy, yy = zz*xx - zx*xz, yz = zx*xy - zy*xx;
  out[0]=xx; out[1]=yx; out[2]=zx; out[3]=0;
  out[4]=xy; out[5]=yy; out[6]=zy; out[7]=0;
  out[8]=xz; out[9]=yz; out[10]=zz; out[11]=0;
  out[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  out[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  out[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  out[15]=1;
}

/* input */
const ptrs = new Map();
let lastPinch = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  idleT = 0;
});
canvas.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  idleT = 0;
  if (ptrs.size === 1) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    vyaw = -dx * 0.005; vpitch = dy * 0.004;
    yaw += vyaw; pitch += vpitch;
  }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch > 0) radius *= lastPinch / d;
    lastPinch = d;
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); lastPinch = 0; };
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  radius *= Math.exp(e.deltaY * 0.0011);
  idleT = 0;
}, { passive: false });
let lastTap = 0;
canvas.addEventListener('pointerdown', () => {
  const t = performance.now();
  if (t - lastTap < 300) { yaw = 0.68; pitch = 0.34; radius = 46; }
  lastTap = t;
});

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener('resize', resize);
resize();

let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (ptrs.size === 0) {
    yaw += vyaw; pitch += vpitch;
    vyaw *= 0.92; vpitch *= 0.92;
    idleT += dt;
    if (idleT > 4) {                                   // ease into a slow auto-orbit
      autoPhase += dt;
      const w = Math.min(1, (idleT - 4) / 3);
      yaw += Math.cos(autoPhase * 0.10) * 0.0009 * w;
      pitch += Math.sin(autoPhase * 0.07) * 0.00025 * w;
    }
  }
  yaw = Math.min(YAW_MAX, Math.max(YAW_MIN, yaw));
  pitch = Math.min(PIT_MAX, Math.max(PIT_MIN, pitch));
  radius = Math.min(95, Math.max(14, radius));

  const cp = Math.cos(pitch);
  const eye = [
    TARGET[0] + radius * Math.sin(yaw) * cp,
    TARGET[1] + radius * Math.sin(pitch),
    TARGET[2] + radius * Math.cos(yaw) * cp,
  ];
  lookAt(view, eye, TARGET, [0, 1, 0]);
  perspective(proj, 50 * Math.PI / 180, canvas.width / canvas.height, 1, 400);

  sortSplats(view);

  gl.useProgram(prog);
  gl.bindVertexArray(vao);
  gl.uniformMatrix4fv(uView, false, view);
  gl.uniformMatrix4fv(uProj, false, proj);
  gl.uniform2f(uFocal, proj[0] * canvas.width / 2, proj[5] * canvas.height / 2);
  gl.uniform2f(uViewport, canvas.width, canvas.height);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
